# Configuração do cargo-deny — aplica a regra de licenciamento do ADR 0003
# (docs/adr/0003-licenciamento.md) e docs/05-dados-e-legal.md §5.3: nenhuma
# dependência copyleft forte (GPL/AGPL) ou proprietária entra por
# transitividade, porque isso reabriria o conflito com a App Store que o
# projeto escolheu explicitamente evitar.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# "allow": os crates do próprio workspace (domain, rules, engine...) são
# dependências de caminho internas, sem versão — nunca publicadas
# (`publish = false` em todo `core/*/Cargo.toml`). A checagem de wildcard
# do cargo-deny existe para pegar dependência *externa* sem pin de versão
# antes de publicar em crates.io, o que não é o nosso caso aqui.
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
# O schema v2 do cargo-deny nega por padrão qualquer licença fora do
# `allow` acima — GPL/AGPL não precisam de uma lista `deny` explícita
# (removida do schema); basta não estarem no allow-list.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
