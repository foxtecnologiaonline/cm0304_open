# CI do núcleo em Rust (core/). Cobre a fatia real e verificável do pipeline
# descrito em docs/02-arquitetura.md §10: fmt, clippy -D warnings, testes, e
# (job `cli-gate`) o próprio portão do M0 — `managerfc-cli pack validate`,
# `bench` e `calibrate` rodando de verdade, não só via `cargo test`
# (docs/07-roadmap.md#m0--fundação-6-semanas).
#
# Ainda faltam (ver docs/07-roadmap.md para o marco de cada item):
#   - benchmarks de dia/temporada (RNF-02/03 — esperam calendário com datas de
#     verdade, `domain::GameDate`, ainda não ligado a `world`) e de mobile
#     (RNF-01 mobile — espera aparelho de referência, docs/08 §6)
#   - build/lint da interface Flutter em app/ (sem SDK Flutter neste passo
#     ainda; entra junto com a ponte flutter_rust_bridge)
#   - build de Android/iOS (cross-compilação/toolchain, M2+)
#
# A matriz roda nas três famílias de OS que hospedam nossas plataformas-alvo
# (Windows nativamente; macOS como proxy de host ARM64 até termos runners
# Android/iOS dedicados) — é a primeira linha de defesa do determinismo
# cross-platform exigido pelo ADR 0002.
name: rust-ci

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "packs/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "packs/**"
      - ".github/workflows/rust-ci.yml"

defaults:
  run:
    working-directory: core

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --workspace

  cargo-deny:
    name: cargo-deny (licenças e advisories — docs/05 §5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

  cli-gate:
    name: cli-gate (${{ matrix.os }}) — portão do M0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: pack validate (pack de exemplo do repositório)
        # `cargo run` (em vez de chamar o binário direto) evita lidar com a
        # extensão `.exe` do Windows aqui.
        run: cargo run -p managerfc-cli --release -- pack validate ../packs/core/example-two-tier
      - name: bench (RNF-01, desktop)
        run: cargo run -p managerfc-cli --release -- bench --trials 20000
      - name: calibrate (sanidade do motor v0, docs/04 §4.1)
        run: cargo run -p managerfc-cli --release -- calibrate --seasons 50
      - name: play (fronteira app::GameSession, docs/02 §4)
        run: cargo run -p managerfc-cli --release -- play --seasons 3
      - name: save/load (persist — round-trip cross-platform, docs/03 §8.1)
        shell: bash
        run: |
          cargo run -p managerfc-cli --release -- save --seasons 3 --seed 7 save.cm0304save
          cargo run -p managerfc-cli --release -- load save.cm0304save
      - name: golden verify (hash de estado cruzado entre plataformas, docs/08 §3/§8)
        # O arquivo é gravado uma vez (`core/tests/golden/s42.json`, commitado)
        # e verificado aqui nas 3 famílias de SO da matriz — é isso que prova
        # que a simulação é byte-a-byte idêntica entre elas (ADR 0002), não
        # só "roda sem erro" em cada uma isoladamente.
        run: cargo run -p managerfc-cli --release -- golden verify --seed 42 --expect tests/golden/s42.json
